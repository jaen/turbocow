[package]
name = "turbocow"
version = "0.3.1-beta.1"
rust-version = "1.85"
authors = ["jaen <hi@jaen.me>"]
edition = "2024"
description = "Compact, clone-on-write vectors, strings, maps and sets with inline + referenced storage — a superset of ecow."
repository = "https://github.com/jaen/turbocow"
homepage = "https://github.com/jaen/turbocow"
documentation = "https://docs.rs/turbocow"
readme = "README.md"
license = "MIT OR Apache-2.0"
categories = ["data-structures", "no-std"]
keywords = ["string", "vector", "map", "cow", "small"]
exclude = [
  "nix/",
  ".github/",
  ".claude/",
  "docs/",
  "scripts/",
  "tools/",
  "reference/",
  "fuzz/",
  ".envrc",
  "NIXSETUP.md",
  "flake.nix",
  "flake.lock",
  "default.nix",
  "shell.nix",
  "rust-toolchain.toml",
  ".cargo/",
  ".hotpath-proxy.yaml",
  "rustfmt.toml",
  "bench-results.txt",
  # benches/ is now its own crate (turbocow-benches), not part of this package.
  "benches/",
]


[dependencies]
serde = { version = "1.0", optional = true, default-features = false }

# Allocator API dependencies (Phase 1-3)
# Using package renaming to support multiple versions simultaneously
allocator-api2-02 = { package = "allocator-api2", version = "0.2.21", optional = true, default-features = false }
allocator-api2-03 = { package = "allocator-api2", version = "0.3.1", optional = true, default-features = false }

hashbrown = { version = "0.15", default-features = false, features = [
  "default-hasher",
  "inline-more",
] }
rkyv = { version = "0.8", optional = true, default-features = false, features = [
  "alloc",
] }

# loom: cfg-gated dependency — see [target.'cfg(loom)'.dependencies] below.

bump-scope = { version = "1.3.0", optional = true }

[dev-dependencies]
# Serialization testing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rkyv = { version = "0.8", features = ["alloc", "bytecheck"] }

# Differential test against upstream ecow (tests/proptest_ecow_diff.rs). The
# other comparison libraries (criterion, im, compact_str, hipstr, lean_string,
# smallvec, litemap, micromap, heapless) live in the standalone benches/ crate
# so they don't compile during `cargo test` / `cargo clippy --all-targets`.
ecow = "0.3.1"

# For allocator integration testing
bump-scope = { version = "1.3.0" }

# Property-based + differential testing. `arbitrary` drives both the proptest
# harness (random bytes → Unstructured) and the cargo-fuzz targets, so the op
# model is written once.
proptest = "1"
arbitrary = { version = "1", features = ["derive"] }

# ── Test binaries requiring specific features ──────────────────────────────

# vec_io tests std::io::Write for EcoVec<u8>, which is only available with std.
[[test]]
name = "vec_io"
required-features = ["std"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
incremental = true
codegen-units = 16

[profile.test]
incremental = true
codegen-units = 16

[profile.bench]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1
incremental = true
overflow-checks = false

[profile.profiling]
inherits = "release"
debug = true
strip = false


# loom 0.7 is pulled in automatically when building with `--cfg loom` (the
# standard loom integration, as used by crossbeam-*). Gating on the cfg rather
# than a Cargo feature means a downstream loom model-check that sets only
# RUSTFLAGS="--cfg loom" gets loom AND routes turbocow's refcount atomics
# through it — the `#[cfg(loom)]` shim in src/lib.rs then resolves.
[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

# hotpath: a cfg-gated PROFILING dependency, same pattern as loom above — pulled in
# ONLY when building with `--cfg hotpath`, never fetched/compiled in CI or by consumers,
# and (being a cfg dep, not a Cargo feature) absent from turbocow's public feature set.
#
# We request only the LIGHT `hotpath` feature here — enough to compile
# `#[cfg_attr(hotpath, hotpath::measure)]` annotations in this crate's own `src/`. The
# heavy in-process MCP server stack (`hotpath-mcp` → axum/rmcp/tokio/schemars/chrono/
# darling) is requested by the `turbocow-benches` crate instead, so it never lands in a
# downstream consumer's Cargo.lock. Profiling runs THROUGH that bench crate (the
# `cargo hotpath` wrapper = `cargo bench --manifest-path benches/Cargo.toml`), so Cargo
# feature-unification re-arms the `/mcp` server in that build and the proxy/live-query
# workflow is unchanged. Profile by pairing the cfg with the `profiling` profile:
#   RUSTFLAGS="--cfg hotpath" cargo bench --profile profiling
[target.'cfg(hotpath)'.dependencies]
hotpath = { version = "0.17", default-features = false, features = ["hotpath"] }

[features]
default = ["std", "alloc"]
std = ["alloc", "allocator-api2-02?/std", "allocator-api2-03?/std"]
# nightly = ["nightly-allocator-api"]

# Allocator API support - disabled by default for Phase 0
# Phase 1-3: Foundation features

## Adds `Global` as the default base allocator and interactions with `alloc` collections
alloc = ["allocator-api2-02?/alloc", "allocator-api2-03?/alloc"]

## Makes turbocow compatible with allocator_api2 version 0.2
allocator-api2-v02 = [
  "dep:allocator-api2-02",
  "bump-scope?/allocator-api2-02",
  "allocator-api",
  "allocator-api-shim",
]

## Makes turbocow compatible with allocator_api2 version 0.3
allocator-api2-v03 = [
  "dep:allocator-api2-03",
  "bump-scope?/allocator-api2-03",
  "allocator-api",
  "allocator-api-shim",
]

# Use stdlib PhantomCovariantLifetime instead of polyfill
nightly-phantom-variance = []

# Enable fmt::Arguments::as_str() fast-path in eco_format! (stable since Rust 1.82)
nightly-fmt = []

# Makes turbocow compatible with nightly Allocator API
nightly-allocator-api = [
  "bump-scope?/nightly-allocator-api",
  "allocator-api2-02?/nightly",
  "allocator-api",
]

# Any allocator support
allocator-api = []

# Allocator support via any of the shims
allocator-api-shim = []

# `loom` is intentionally NOT a feature — it is a cfg-gated dependency (see
# [target.'cfg(loom)'.dependencies]) so a downstream loom model-check that sets
# only RUSTFLAGS="--cfg loom" pulls it in automatically.
rkyv = ["dep:rkyv"]

[package.metadata.docs.rs]
# Document the stable public API: default (std+alloc) + serde + rkyv + the
# stable custom-allocator support (allocator-api2-v03). nightly-allocator-api
# is omitted because it requires a nightly toolchain.
features = ["serde", "rkyv", "allocator-api2-v03"]
rustdoc-args = ["--cfg", "docsrs"]
