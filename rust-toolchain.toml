[toolchain]
# Must ship the stable `core::alloc::Allocator` (Rust >= 1.100, Cargo.toml's
# rust-version). Bump the rust-overlay flake input together with this pin.
channel = "nightly-2026-10-11"
profile = "minimal"
components = [
  "cargo",
  "clippy",
  "rust-analyzer",
  "rust-src",
  "rustc",
  "rustfmt",
  "rustc-codegen-cranelift-preview",
  "miri",
]
